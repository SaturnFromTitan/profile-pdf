name: Build, release and deploy the PDF to GitHub pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-checks:
    uses: $/.github/workflows/partial-ci-checks.yml

  build:
    runs-on: ubuntu-latest
    needs: ci-checks
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Build docker container and generate PDF
        run: |
          touch .env
          docker build --target production -t pdf-generator .
          docker run --rm -v "$(pwd)/public:/app/public" pdf-generator

      - name: Upload artifact for release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pdfs
          path: public/*.pdf

      - name: Upload artifact for pages deployment
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: public

  release:
    runs-on: ubuntu-latest
    needs: [ci-checks, build]
    permissions:
      contents: write
    steps:
      - name: Download PDF artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: pdfs
          path: .
          merge-multiple: true

      - name: Create Release # zizmor: ignore[superfluous-actions] Preserve release updates and asset replacement on reruns.
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v${{ needs.ci-checks.outputs.version }}
          name: Release v${{ needs.ci-checks.outputs.version }}
          files: "*.pdf"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
